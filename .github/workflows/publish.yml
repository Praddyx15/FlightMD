name: Publish to PyPI

# Push a tag like v1.1.0 (matching pyproject's version) to release flightmd-core.
# Uses PyPI Trusted Publishing: no token in the repo. One-time setup on pypi.org:
# project -> Publishing -> add GitHub publisher (owner Praddyx15, repo FlightMD,
# workflow publish.yml, environment pypi).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build sdist and wheel
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but pyproject says $version"
            exit 1
          fi

      - name: Build
        run: |
          pip install build==1.2.2 twine==6.1.0
          python -m build
          twine check --strict dist/*

      - name: Wheel carries the data files and PDF templates
        run: |
          python -m zipfile -l dist/*.whl > contents.txt
          grep -q "flightmd_core/exporters/templates/report.html" contents.txt
          grep -q "flightmd_core/data/param_safe_ranges.json" contents.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/flightmd-core
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
