name: Deploy

# Only after CI has passed on main
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-backend:
    name: Deploy API to Render
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set, skipping Render deploy."
            exit 0
          fi
          curl -s -X POST "$RENDER_DEPLOY_HOOK" --fail --retry 3
          echo "Render deploy triggered."

  deploy-frontend:
    name: Deploy Frontend to Vercel
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          cd frontend
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  smoke-test:
    name: Smoke Test Production
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]

    steps:
      - name: API health
        run: |
          # free-tier Render can take a minute or two to come back after a deploy
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" https://flightmd-api.onrender.com/health --max-time 30 || echo 000)
            echo "attempt $i: $status"
            [ "$status" = "200" ] && exit 0
            sleep 15
          done
          echo "API never returned 200"
          exit 1

      - name: Frontend
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://flightmd.vercel.app --max-time 30 || echo 000)
          echo "frontend: $status"
          [ "$status" = "200" ]
