[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightmd-core"
version = "1.0.0"
description = "Flight log analysis engine for PX4, ArduPilot and MAVLink logs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Pradum Behl", email = "pradumbehl14@gmail.com" }
]
keywords = ["PX4", "ULog", "drone", "flight-analysis", "UAV", "avionics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pyulog>=0.9.0",
    "pymavlink>=2.4.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pydantic>=2.5",
]

[project.optional-dependencies]
ai = [
    "anthropic>=0.20",
    "openai>=1.30",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",
]

[tool.setuptools.packages.find]
include = ["flightmd_core*"]

[tool.setuptools.package-data]
flightmd_core = ["data/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires real sample log files in tests/sample_logs/",
]
