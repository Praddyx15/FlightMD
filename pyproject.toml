[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightmd-core"
version = "1.0.0"
description = "PX4 ULog analysis engine — core package"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Pradum Behl", email = "pradum@sixtymotion.aero" }
]
keywords = ["PX4", "ULog", "drone", "flight-analysis", "UAV", "avionics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pyulog>=0.9.0",
    "pymavlink>=2.4.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pydantic>=2.5",
    "anthropic>=0.20",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",
]

[tool.setuptools.packages.find]
include = ["flightmd_core*"]

[tool.setuptools.package-data]
flightmd_core = ["data/**/*.json"]
