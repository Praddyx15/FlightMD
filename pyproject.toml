[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flightmd-core"
version = "1.1.0"
description = "Flight log analysis engine for PX4, ArduPilot and MAVLink logs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Pradum Behl", email = "pradumbehl14@gmail.com" }
]
keywords = ["PX4", "ULog", "drone", "flight-analysis", "UAV", "avionics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pyulog>=0.9.0",
    "pymavlink>=2.4.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pydantic>=2.5",
]

[project.urls]
Homepage = "https://github.com/Praddyx15/FlightMD"
Source = "https://github.com/Praddyx15/FlightMD"
Issues = "https://github.com/Praddyx15/FlightMD/issues"

[project.scripts]
flightmd = "flightmd_core.__main__:main"

[project.optional-dependencies]
ai = [
    "anthropic>=0.20",
    "openai>=1.30",
]
# PDF export (flightmd_core.exporters.pdf); WeasyPrint also needs Pango from the OS
pdf = [
    "weasyprint>=61",
    "jinja2>=3.1",
]
# API extras: contributed logs in S3-compatible storage, and the Redis job queue
s3 = [
    "boto3>=1.34",
]
queue = [
    "arq>=0.26",
]
# DJI flight records v13+ are AES-encrypted
dji = [
    "cryptography>=41",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",
    "ruff>=0.8",
    "strictdoc>=0.31",
]

[tool.setuptools.packages.find]
include = ["flightmd_core*"]

[tool.setuptools.package-data]
flightmd_core = ["data/**/*.json", "exporters/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires real sample log files in tests/sample_logs/",
    "corpus: real-log regression corpus in tests/corpus/ (slow, run weekly in CI)",
]

[tool.coverage.run]
source = ["flightmd_core", "api"]
omit = ["api/worker.py"]

[tool.ruff]
extend-exclude = ["tools/walkthrough"]

[tool.ruff.lint]
# every ignore below is a listed deviation in docs/lifecycle/02-standards/coding-standard-python.md
select = ["E", "W", "F", "B", "BLE", "S", "C4", "PIE", "PGH", "ASYNC", "DTZ", "UP", "SIM", "RUF100"]
ignore = ["E501", "B904", "B905", "SIM105", "UP007", "UP017", "UP035", "UP038"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "BLE", "S", "C4", "PIE", "DTZ", "UP", "SIM", "ASYNC"]
"flightmd_core/cache.py" = ["S301"]
"flightmd_core/orchestrator.py" = ["BLE001"]
"flightmd_core/analysers/base.py" = ["BLE001"]
"flightmd_core/analysers/registry.py" = ["BLE001"]
"flightmd_core/analysers/motors.py" = ["B007"]
"flightmd_core/analysers/gps.py" = ["C401"]
"flightmd_core/services/ai_enhancer.py" = ["BLE001"]
"flightmd_core/services/weather_lookup.py" = ["BLE001", "S310"]
"flightmd_core/services/geocoding.py" = ["BLE001", "S310"]
"flightmd_core/services/dji_parser.py" = ["S310"]
"flightmd_core/services/ulog_parser.py" = ["SIM115"]
"api/analysis.py" = ["BLE001"]
"api/services/report_qa.py" = ["BLE001"]
"api/routers/analyse.py" = ["B008"]
"api/security.py" = ["S105"]
"api/config.py" = ["UP011"]
"api/legacy_import.py" = ["UP015"]
"api/storage.py" = ["UP037"]
"scripts/gen_param_tables.py" = ["BLE001", "S310", "S314", "DTZ011"]
"scripts/generate_sample_logs.py" = ["C408", "UP012"]
"tools/trace.py" = ["S603"]
